    <a href="#main_content" class="skip_nav">Skip to main content</a>

    <header id="header">
        <div class="header_inner">

            <button type="button" class="menu_btn" aria-label="Open menu">☰</button>

            <h1 class="logo">
                <a href="#">
                    <img src="img_ferrari/ferrari_logo_1.png" alt="Ferrari">
                </a>
            </h1>

            <div class="header_right">
                <div class="lang">
                    <button type="button" class="lang_btn active" data-lang="en">EN</button>
                    <span>/</span>
                    <button type="button" class="lang_btn" data-lang="ko">KR</button>
                </div>

                <a href="#" class="login"
                   data-en="Login"
                   data-ko="로그인">Login</a>
            </div>

        </div>
    </header>

    <section class="hero" id="main_content">
        <div class="hero_visual">

        <!-- 배경 -->
        <img src="img_ferrari/ferrari_pc_main_banner_bg_red_1980X1080.png" alt="" class="bg">

       <!-- 앞에 차 -->
       <div class="car_wrap car_front">
       <span class="car_shadow"></span>
       <img src="img_ferrari/Untitled-1.png" alt="Ferrari front car" class="car_img">
    </div>

       <!-- 뒤에 차 -->
       <div class="car_wrap car_back">
       <span class="car_shadow"></span>
       <img src="img_ferrari/ferrari_maincar_back2.png" alt="Ferrari rear car" class="car_img">
    </div>
   
</div>
        

        <div class="hero_overlay"></div>

        <div class="hero_text">
            <p class="hero_sub hero_animate hero_animate_1"
               data-en="FERRARI SF90 XX"

               FERRARI SF90 XX
            </p>

            <h2 class="hero_title">
                <span class="title_line hero_animate hero_animate_2"
                      data-en="UNLEASH"
                      data-ko="파워를">

                    <em class="hero_highlight"
                        data-en="POWER"
                        data-ko="파워">POWER</em>
